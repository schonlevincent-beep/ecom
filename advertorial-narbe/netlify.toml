# Netlify Image CDN: Bilder von Knightvision automatisch verkleinern und als WebP ausliefern
[images]
  remote_images = ["https://knightvision.tech/static/generated_images/.*"]

# Seiten kurz cachen, damit Änderungen schnell sichtbar sind
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Lesbare Adressen (die alten Links /, /c83, /c88 funktionieren weiterhin)
[[redirects]]
  from = "/narbe-schmerzt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/narbe-uebersehen"
  to = "/c83.html"
  status = 200

[[redirects]]
  from = "/narbe-zieht"
  to = "/c88.html"
  status = 200
